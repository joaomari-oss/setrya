services:
  # Redis — Celery broker/result backend + cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Local Postgres with pgvector. Default DB — swap DATABASE_URL in the backend/worker
  # environment blocks below for Supabase when the real pooler URL is filled in .env.
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: setrya
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI API
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/setrya
      DATABASE_URL_SYNC: postgresql://postgres:postgres@postgres:5432/setrya
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      CORS_ORIGINS: http://localhost:3000
      # Local dev = self-contained: store audio on the shared `uploads` volume
      # instead of Supabase Storage (which needs valid cloud creds + network).
      SUPABASE_URL: ""
      SUPABASE_SERVICE_KEY: ""
      # Online set building runs librosa here too; pin native thread pools to 1 to
      # avoid the fork+OpenMP SIGSEGV (signal 11) that crashes audio analysis.
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMBA_NUM_THREADS: "1"
      NUMBA_THREADING_LAYER: workqueue
      NUMBA_CACHE_DIR: /tmp/numba
      # Dev machine sits behind Avast TLS inspection → skip cert verify on music APIs.
      EXTERNAL_SSL_VERIFY: "false"
    volumes:
      - uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Celery worker — audio analysis, waveform, embeddings
  worker:
    build: ./backend
    command: celery -A app.celery_app.celery_app worker --loglevel=info --concurrency=2
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/setrya
      DATABASE_URL_SYNC: postgresql://postgres:postgres@postgres:5432/setrya
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      SUPABASE_URL: ""
      SUPABASE_SERVICE_KEY: ""
      # Pin native thread pools to 1 — fixes the librosa/numba fork SIGSEGV (signal 11).
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMBA_NUM_THREADS: "1"
      NUMBA_THREADING_LAYER: workqueue
      NUMBA_CACHE_DIR: /tmp/numba
      EXTERNAL_SSL_VERIFY: "false"
    volumes:
      - uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Next.js frontend
  frontend:
    build:
      context: ./frontend
      args:
        # api.ts uses a RELATIVE base ("/api/v1"); next.config.ts rewrites proxy
        # those requests SERVER-SIDE from the Next node process, which runs inside
        # this container — so it must use the Docker-internal hostname, not localhost.
        NEXT_PUBLIC_API_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
